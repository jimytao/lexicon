<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Lexicon</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('lexicon-settings') || '{}');
        const state = s && s.state ? s.state : {};
        let appearance = state.appearance;
        if (appearance !== 'light' && appearance !== 'dark' && appearance !== 'system') {
          if (typeof state.darkMode === 'boolean') appearance = state.darkMode ? 'dark' : 'light';
          else appearance = 'system';
        }
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        // Keep in sync with src/services/appearance.ts migrateAppearance + resolveDark
        const isDark = appearance === 'dark' || (appearance === 'system' && systemDark);
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Long+Cang&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: macOS Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Build Tauri macOS Bundle
        run: |
          npx tauri build --target universal-apple-darwin || npx tauri build

      - name: Prepare macOS Artifacts
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="0.9.10"
          fi
          mkdir -p "$RUNNER_TEMP/macOS"
          
          # Find DMG file if generated
          DMG_FILE=$(find src-tauri/target -name "*.dmg" | head -1)
          if [ -n "$DMG_FILE" ]; then
            cp "$DMG_FILE" "$RUNNER_TEMP/macOS/Lexicon_${VERSION}_universal.dmg"
          fi
          
          # Zip .app bundle for backup distribution
          APP_PATH=$(find src-tauri/target -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            cd "$(dirname "$APP_PATH")"
            zip -r "$RUNNER_TEMP/macOS/Lexicon_${VERSION}_macOS.app.zip" "$(basename "$APP_PATH")"
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lexicon-macOS-${{ github.ref_name }}
          path: ${{ runner.temp }}/macOS/*
          retention-days: 30

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/macOS/*

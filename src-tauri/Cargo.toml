[package]
name = "lexicon"
version = "0.6.1"
description = "Lexicon — English learning tool for Chinese speakers"
authors = ["Julian"]
edition = "2021"

[lib]
name = "lexicon_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
